<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>PokéValue — Sua carteira de cartas</title>
  <meta name="description" content="Carteira de cartas Pokémon TCG: fotografe, cadastre o valor e acompanhe seu patrimônio." />
  <meta name="theme-color" content="#0A0D1A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PokéValue" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

  <div id="app">
    <main id="view" class="view"></main>

    <nav class="tabbar" id="tabbar">
      <a href="#/" data-tab="home" class="tab">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Início</span>
      </a>
      <a href="#/colecao" data-tab="collection" class="tab">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="11" rx="1.5"/><rect x="13" y="4" width="8" height="11" rx="1.5"/><path d="M5 19h14"/></svg>
        <span>Coleção</span>
      </a>
      <a href="#/nova" class="tab-fab" aria-label="Escanear nova carta">
        <span class="fab-ring"></span>
        <svg viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h1.5l1.2-1.8A1 1 0 0 1 9.5 4h5a1 1 0 0 1 .8.4L16.5 6H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.5"/></svg>
      </a>
      <a href="#/analise" data-tab="insights" class="tab">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Análise</span>
      </a>
      <a href="#/ajustes" data-tab="settings" class="tab">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span>Perfil</span>
      </a>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status"></div>

  <input type="file" id="file-camera" accept="image/*" capture="environment" hidden />
  <input type="file" id="file-gallery" accept="image/*" hidden />
  <input type="file" id="file-import" accept="application/json,.json" hidden />

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
